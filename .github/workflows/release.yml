name: release

# VERSION is the release boundary for this fork. CI validates changes before they
# reach main; changing VERSION publishes that exact main revision.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid VERSION: ${version}" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Go binary embeds web/dist (embed.FS), so the frontend must be built first.
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      # Build both arches in one job so web/dist is compiled once and a single
      # SHA256SUMS holds every asset.
      - name: Build binaries (linux/amd64 + linux/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/AppsGanin/rospanel/internal/version.Version=${VERSION}" \
              -o "rospanel-linux-$arch" ./cmd/rospanel/
          done

      - name: Generate checksums
        run: sha256sum rospanel-linux-amd64 rospanel-linux-arm64 > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            rospanel-linux-amd64 rospanel-linux-arm64 SHA256SUMS \
            --target "$GITHUB_SHA" --generate-notes --title "$TAG"

  build-image:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-release.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
